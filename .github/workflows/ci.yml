name: CI

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MANIFEST: packages/core/Cargo.toml
  PROJECT: packages/app/SteamGridUI.csproj

jobs:
  check:
    name: Build and test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # channel comes from rust-toolchain.toml
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy
          rustflags: ""
          cache-workspaces: packages/core

      - name: Format check (rust)
        shell: bash
        run: cargo fmt --manifest-path "$MANIFEST" -- --check

      - name: Clippy
        shell: bash
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --manifest-path "$MANIFEST"

      # also builds the rust core in release mode
      - name: Build app
        shell: bash
        run: dotnet build "$PROJECT" -c Release

      - name: Format check (c#)
        shell: bash
        run: dotnet format "$PROJECT" --verify-no-changes --no-restore
