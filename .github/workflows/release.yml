name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_name }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ""
          cache: false

      - name: Test core
        shell: bash
        run: cargo test --manifest-path packages/core/Cargo.toml

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # single exe with the rust core bundled inside
      - name: Publish app
        shell: bash
        run: dotnet publish packages/app/SteamGridUI.csproj -c Release -p:Version="${VERSION#v}" -o dist

      # inno setup ships with the runner image
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version ($env:VERSION -replace '^v', '')

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam-grid-ui-windows
          path: |
            dist/SteamGridUI.exe
            dist/SteamGridUI-*-setup.exe
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # create the release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: steam-grid-ui-windows
          path: dist

      - name: Generate SHA256 checksums
        run: bash .github/workflows/scripts/checksum.sh dist/SteamGridUI.exe dist/SteamGridUI-*-setup.exe

      - name: Extract release notes
        run: bash .github/workflows/scripts/extract-changelog.sh "$VERSION" CHANGELOG.md > release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$VERSION" --notes-file release_notes.md dist/SteamGridUI-*-setup.exe dist/SteamGridUI-*-setup.exe.sha256 dist/SteamGridUI.exe dist/SteamGridUI.exe.sha256
