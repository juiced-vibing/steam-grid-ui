name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_name }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
          cache: false

      - name: Test core
        shell: bash
        run: cargo test --manifest-path packages/core/Cargo.toml

      # single exe with the rust core bundled inside
      - name: Publish app
        shell: bash
        run: dotnet publish packages/app/SteamGridUI.csproj -c Release -p:Version="${VERSION#v}" -o dist

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam-grid-ui-windows
          path: dist/SteamGridUI.exe
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # create the release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: steam-grid-ui-windows
          path: dist

      - name: Generate SHA256 checksums
        run: bash .github/workflows/scripts/checksum.sh dist/SteamGridUI.exe

      - name: Extract release notes
        run: bash .github/workflows/scripts/extract-changelog.sh "$VERSION" CHANGELOG.md > release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$VERSION" --notes-file release_notes.md \
            dist/SteamGridUI.exe \
            dist/SteamGridUI.exe.sha256
